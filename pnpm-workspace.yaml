allowBuilds:
  '@parcel/watcher': true
  '@primer/primitives': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
catalog:
  electron: '44.7.0'
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  vitest: 5.0.5
  vite-plus: 0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - electron-menubar
overrides:
  react-is: '19.3.0'
  # Force patched versions of transitive dev-tooling deps pulled in by
  # react-devtools (old electron/got/cross-spawn) so they don't trip security
  # scanners. None of these ship in the packaged app.
  cross-spawn: '7.0.6'
  got: '11.8.6'
  electron: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
savePrefix: ''
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
